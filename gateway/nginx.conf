# Include in nginx's http context, e.g. /etc/nginx/conf.d/devops.conf.
# Same-origin TLS entry point for DevOps, OAuth and Smart HTTP Git.

upstream devops_api {
    # The Gateway uses host networking; the API is published on loopback only.
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream devops_git_cgi {
    # fcgiwrap FastCGI listener, never a public HTTP port.
    server 127.0.0.1:9000;
    # Alternatively: server unix:/run/fcgiwrap.socket;
}

upstream devops_registry {
    server 127.0.0.1:5000;
    keepalive 16;
}

# Only the trusted auth subrequest can remove an unavailable mount source.
# A plain upload returns 202 without disclosing or linking the source blob.
map $devops_registry_upload_only $devops_registry_target {
    default $request_uri;
    "1" $uri;
}

# HTTP/3 clients may send :authority without a literal Host header. Preserve
# explicit ports too (request_port / is_request_port require Nginx >= 1.29.3).
map $http_host $devops_request_host {
    default $http_host;
    "" "$host$is_request_port$request_port";
}

# Match the original URI, including the exact query string. Unknown methods,
# duplicate service parameters, encoded paths and extra query parameters fail closed.
map "$request_method:$request_uri" $devops_git_operation {
    default "";
    "~^GET:/git/[a-z][a-z0-9_.-]{2,31}/[a-z0-9][a-z0-9._-]{0,99}\.git/info/refs\?service=git-upload-pack$" read;
    "~^POST:/git/[a-z][a-z0-9_.-]{2,31}/[a-z0-9][a-z0-9._-]{0,99}\.git/git-upload-pack$" read;
    "~^GET:/git/[a-z][a-z0-9_.-]{2,31}/[a-z0-9][a-z0-9._-]{0,99}\.git/info/refs\?service=git-receive-pack$" write;
    "~^POST:/git/[a-z][a-z0-9_.-]{2,31}/[a-z0-9][a-z0-9._-]{0,99}\.git/git-receive-pack$" write;
}

# These values are populated by auth_request_set, then evaluated by FastCGI.
# A successful auth response MUST contain both positive numeric database IDs.
# /dev/null is deliberately not executable: malformed auth responses cannot run Git.
map "$devops_git_user_id:$devops_git_repository_id" $devops_git_script {
    default /dev/null;
    "~^[1-9][0-9]{0,18}:[1-9][0-9]{0,18}$" /usr/local/bin/devops-git-http-backend;
}

# Avoid recording OAuth query parameters, cookies or Authorization headers.
log_format devops_gateway '$remote_addr [$time_local] "$request_method $uri" '
                        '$status $body_bytes_sent request_id=$request_id '
                        'request_time=$request_time protocol=$server_protocol';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    http3 on;
    quic_retry on;
    server_name devops.kevinc.ltd;
    ssl_certificate /cert/kevinc.pem;
    ssl_certificate_key /cert/kevinc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Authenticated writes must not be replayed as TLS 0-RTT early data.
    ssl_early_data off;
    ssl_session_cache shared:DEVOPS_TLS:10m;

    # Mount the stable parent directory so atomic current-symlink switches are visible.
    root /usr/share/nginx/html/current;
    index index.html;

    access_log /dev/stdout devops_gateway;
    error_log /dev/stderr warn;

    client_max_body_size 16m;
    client_body_timeout 300s;
    send_timeout 300s;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Request-ID $request_id always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # Configure set_real_ip_from with ONLY your ingress/CDN addresses if needed.
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $devops_request_host;
    # TLS terminates here. OAuth callbacks are validated against fixed loopback rules.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $devops_request_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Request-ID $request_id;
    proxy_cache off;

    location = /_internal/git/authorize {
        internal;
        proxy_pass http://devops_api/_internal/git/authorize;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header Host $devops_request_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-Method $devops_git_method;
        proxy_set_header X-Original-URI $devops_git_uri;
        proxy_set_header X-Git-Repository $devops_git_slug;
        proxy_set_header X-Git-Owner $devops_git_owner;
        proxy_set_header X-Git-Operation $devops_git_action;
        proxy_set_header X-Request-ID $devops_git_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
    }

    location = /_internal/registry/authorize {
        internal;
        proxy_pass http://devops_api/_internal/registry/authorize;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header Host $devops_request_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-Method $devops_registry_method;
        proxy_set_header X-Original-URI $devops_registry_uri;
        proxy_set_header X-Request-ID $devops_registry_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
    }

    location ^~ /v2/ {
        set $devops_registry_method $request_method;
        set $devops_registry_uri $request_uri;
        set $devops_registry_request_id $request_id;
        auth_request /_internal/registry/authorize;
        auth_request_set $devops_registry_upload_only $upstream_http_x_registry_upload_only;
        error_page 401 = @registry_unauthorized;
        error_page 403 = @registry_denied;
        client_max_body_size 5g;
        client_body_timeout 900s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_set_header Host $devops_request_host;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $devops_request_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $devops_registry_request_id;
        proxy_hide_header Docker-Distribution-Api-Version;
        add_header Docker-Distribution-Api-Version registry/2.0 always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://devops_registry$devops_registry_target;
    }

    location @registry_unauthorized {
        default_type application/json;
        add_header WWW-Authenticate 'Basic realm="DevOps Registry", charset="UTF-8"' always;
        add_header Docker-Distribution-Api-Version registry/2.0 always;
        add_header Cache-Control "no-store" always;
        return 401 '{"errors":[{"code":"UNAUTHORIZED","message":"Docker token required"}]}';
    }

    location @registry_denied {
        default_type application/json;
        add_header Docker-Distribution-Api-Version registry/2.0 always;
        add_header Cache-Control "no-store" always;
        return 403 '{"errors":[{"code":"DENIED","message":"Registry access denied"}]}';
    }

    location ^~ /_internal/ {
        return 404;
    }

    location ~ "^/git/(?<devops_git_route_owner>[a-z][a-z0-9_.-]{2,31})/(?<devops_git_route_slug>[a-z0-9][a-z0-9._-]{0,99})\.git/(?<devops_git_route_endpoint>info/refs|git-upload-pack|git-receive-pack)$" {
        if ($devops_git_operation = "") { return 404; }

        # Freeze the parent request metadata before the GET auth subrequest.
        set $devops_git_method $request_method;
        set $devops_git_uri $request_uri;
        set $devops_git_query $args;
        set $devops_git_slug $devops_git_route_slug;
        set $devops_git_owner $devops_git_route_owner;
        set $devops_git_endpoint $devops_git_route_endpoint;
        set $devops_git_action $devops_git_operation;
        set $devops_git_request_id $request_id;

        auth_request /_internal/git/authorize;
        auth_request_set $devops_git_user_id $upstream_http_x_oa_user_id;
        auth_request_set $devops_git_repository_id $upstream_http_x_git_repository_id;
        auth_request_set $devops_git_protect_main $upstream_http_x_git_protect_main;
        auth_request_set $devops_git_protect_push $upstream_http_x_git_protect_push;

        client_max_body_size 1g;
        gzip off;
        brotli off;
        fastcgi_pass devops_git_cgi;
        fastcgi_pass_request_headers off;
        fastcgi_pass_request_body on;
        # Keep request buffering until large/chunked pushes are validated with
        # the selected CGI runtime. Ensure nginx's body temp directory has space.
        fastcgi_request_buffering on;
        fastcgi_buffering off;
        fastcgi_cache off;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 900s;
        fastcgi_send_timeout 900s;
        fastcgi_next_upstream off;
        fastcgi_intercept_errors off;

        fastcgi_param SCRIPT_FILENAME $devops_git_script;
        fastcgi_param SCRIPT_NAME /git;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param REQUEST_METHOD $devops_git_method;
        fastcgi_param REQUEST_URI $devops_git_uri;
        fastcgi_param QUERY_STRING $devops_git_query;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param REMOTE_USER $devops_git_user_id;
        fastcgi_param GIT_PROJECT_ROOT /mnt/git-repos;
        fastcgi_param PATH_INFO /$devops_git_repository_id.git/$devops_git_endpoint;
        fastcgi_param GIT_HTTP_EXPORT_ALL 1;
        fastcgi_param GIT_PROTOCOL $http_git_protocol;
        fastcgi_param DEVOPS_PROTECT_MAIN $devops_git_protect_main;
        fastcgi_param DEVOPS_PROTECT_PUSH $devops_git_protect_push;
    }

    # LFS authenticates every request with Git OAuth in the API, never cookies.
    # No CGI/static fallback; batch JSON is bounded again by the application.
    location ~ "^/git/[a-z][a-z0-9_.-]{2,31}/[a-z0-9][a-z0-9._-]{0,99}\.git/info/lfs/" {
        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_next_upstream off;
        proxy_pass http://devops_api;
    }

    # Never expose loose objects, pack files, repository config or hooks directly.
    location /git/ {
        return 404;
    }

    # Explicit protocol endpoints: other /oauth routes belong to the Vue SPA.
    location = /oauth/authorize {
        proxy_pass http://devops_api;
    }

    location = /oauth/token {
        client_max_body_size 64k;
        proxy_pass http://devops_api;
        proxy_next_upstream off;
    }

    location = /oauth/revoke {
        client_max_body_size 64k;
        proxy_pass http://devops_api;
        proxy_next_upstream off;
    }

    location = /oauth/device/code {
        client_max_body_size 64k;
        proxy_pass http://devops_api;
        proxy_next_upstream off;
    }

    # Versioned public CLI packages survive website release switches.
    location ^~ /res/devops-cli/ {
        root /usr/share/nginx/html;
        autoindex off;
        disable_symlinks on;
        limit_except GET HEAD { deny all; }
        types { application/gzip tgz; text/plain sha256; }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location ^~ /res/devops-runner/ {
        root /usr/share/nginx/html;
        autoindex off;
        disable_symlinks on;
        limit_except GET HEAD { deny all; }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://devops_api;
    }

    location = /api/ci/worker {
        proxy_pass http://devops_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location ~ ^/api/ci/artifacts/[0-9]+$ {
        client_max_body_size 256m;
        proxy_request_buffering off;
        proxy_pass http://devops_api;
        proxy_read_timeout 300s;
    }

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Keep content-hashed assets from previous releases available to already-open tabs.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
