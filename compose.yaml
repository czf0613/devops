name: devops-local

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/init_env.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8.8.3-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init_env.py first}
    entrypoint: ["/bin/sh", "/usr/local/bin/devops-redis-start.sh"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
      - ./scripts/redis-start.sh:/usr/local/bin/devops-redis-start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
