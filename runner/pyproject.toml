[project]
name = "devops-runner"
version = "1.1.0"
description = "DevOps CI native worker"
requires-python = ">=3.14,<3.15"
dependencies = ["websockets>=15,<17", "httpx>=0.28,<1"]

[project.scripts]
devops-runner = "devops_runner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devops_runner"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
