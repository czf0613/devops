[project]
name = "devops-server"
version = "1.0.0"
description = "Development collaboration platform"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "bcrypt>=5,<6",
  "cryptography>=46,<52",
  "email-validator>=2.3,<3",
  "fastapi>=0.135,<1",
  "markdown-it-py>=4,<5",
  "psutil>=7.2,<8",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "redis>=8.1,<9",
  "sqlalchemy>=2.0.44,<2.1",
  "uvicorn>=0.53,<1",
  "websockets>=15,<17",
  "ruamel.yaml>=0.18,<0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/devops_server"]

[dependency-groups]
dev = [
    "aioquic>=1.3,<2",
    "httpx2>=2.13,<3",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
